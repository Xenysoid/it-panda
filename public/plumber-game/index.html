<style>

<body>
<div id="wrap">

<script>
(() => {
'use strict';

// ============================================================
//  Настройки сайта
// ============================================================
const DEFAULTS = {
  company: 'Служба прочистки канализации',
  phone:   '8-980-323-36-99',
  url:     '#',
  cta:     'Вызвать мастера',
  promo:   '',            // например 'ZASOR10' — показывается после победы
  api:     'leaderboard.php', // общая таблица рекордов (файл на сервере); 'off' — отключить
};
const qs = new URLSearchParams(location.search);
const CONFIG = {};
for (const k of Object.keys(DEFAULTS)) CONFIG[k] = qs.get(k) || DEFAULTS[k];

// ============================================================
//  Константы
// ============================================================
const T = 32, VW = 960, VH = 544, ROWS = 17;
const GRAV = 0.55, MAXFALL = 12;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
const stage = document.getElementById('stage');
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || matchMedia('(pointer: coarse)').matches;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function resize() {
  const touchPad = isTouch ? 0 : 0;
  const s = Math.min(innerWidth / VW, (innerHeight - touchPad) / VH);
  stage.style.width = Math.floor(VW * s) + 'px';
  stage.style.height = Math.floor(VH * s) + 'px';
}
addEventListener('resize', resize); resize();

// ============================================================
//  Ввод
// ============================================================
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump', KeyW:'jump', Space:'jump', KeyZ:'jump', KeyK:'jump',
  ArrowDown:'down', KeyS:'down',
  KeyX:'act', KeyJ:'act', ShiftLeft:'act', ShiftRight:'act', KeyF:'act',
  Enter:'start', KeyP:'pause', Escape:'pause', KeyM:'mute',
};
function kdown(a) { if (!keys[a]) pressed[a] = true; keys[a] = true; }
function kup(a) { keys[a] = false; }
addEventListener('keydown', e => {
  const tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA') return; // ввод имени в таблицу рекордов
  const a = KEYMAP[e.code]; if (!a) return;
  const ae = document.activeElement;
  if (panel.classList.contains('show') && (a === 'start' || a === 'jump') && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
  e.preventDefault(); ensureAudio(); kdown(a);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { e.preventDefault(); kup(a); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.state === 'play') setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') setPause(true); });

if (isTouch) { document.getElementById('touch').classList.add('on'); document.body.classList.add('touch'); }

// ---------- Подсказка для iPhone: полный экран возможен только через «На экран Домой»
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
const iosHint = document.getElementById('iosHint');
function showIosHint() {
  if (!isIOS || isStandalone || store('vz_ioshint') === '0') return;
  document.getElementById('iosHintText').innerHTML = inFrame
    ? 'На весь экран: <a href="' + location.href.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener">откройте игру отдельно</a>, затем «Поделиться» → «На экран Домой»'
    : 'На весь экран: нажмите «Поделиться» → «На экран Домой» и запускайте игру с иконки';
  iosHint.classList.add('on');
}
function hideIosHint() { iosHint.classList.remove('on'); }
document.getElementById('iosHintX').onclick = e => { e.stopPropagation(); store('vz_ioshint', '0'); hideIosHint(); };
showIosHint();

// ---------- Полноэкранный режим
const fsEl = document.documentElement;
const fsSupported = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen) && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function lockLandscape() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }
function toggleFs() {
  if (!fsSupported) return;
  try {
    if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl, { navigationUI: 'hide' });
      if (r && r.then) r.then(lockLandscape).catch(() => {}); else lockLandscape();
    }
  } catch (e) {}
}
document.addEventListener('fullscreenchange', () => setTimeout(resize, 50));
document.addEventListener('webkitfullscreenchange', () => setTimeout(resize, 50));
const portraitMq = matchMedia('(orientation: portrait)');
function onOrient() { if (isTouch && portraitMq.matches && G.state === 'play') setPause(true); setTimeout(resize, 100); }
if (portraitMq.addEventListener) portraitMq.addEventListener('change', onOrient); else if (portraitMq.addListener) portraitMq.addListener(onOrient);
document.querySelectorAll('#touch .tb').forEach(el => {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); ensureAudio(); kdown(k); el.classList.add('down'); if (el.setPointerCapture) try { el.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { e.preventDefault(); kup(k); el.classList.remove('down'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
});
// Кнопки звука и паузы нарисованы в HUD (правый верхний угол канваса)
const HUD_BTNS = { mute: { x: VW - 76, y: 5, w: 32, h: 30 }, pause: { x: VW - 38, y: 5, w: 32, h: 30 }, fs: { x: VW - 114, y: 5, w: 32, h: 30 } };
const HUD_RIGHT = fsSupported ? VW - 126 : VW - 88;
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * VW, y = (e.clientY - r.top) / r.height * VH;
  const inB = b => x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 6 && y <= b.y + b.h + 6;
  if (inB(HUD_BTNS.mute)) { toggleMute(); return; }
  if (fsSupported && inB(HUD_BTNS.fs)) { toggleFs(); return; }
  if (inB(HUD_BTNS.pause) && G.state !== 'title') { if (G.state === 'play') setPause(true); else if (G.state === 'pause') setPause(false); return; }
  if (G.state === 'title') { if (isTouch && !isFs()) toggleFs(); startGame(); }
});

// ============================================================
//  Звук (WebAudio синтез)
// ============================================================
let actx = null, muted = store('vz_muted') === '1';
let audioUnlocked = false;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (!actx) return;
  if (actx.state !== 'running') actx.resume();
  if (!audioUnlocked) { // разблокировка звука на iOS/Safari: короткий беззвучный буфер в момент нажатия
    audioUnlocked = true;
    try { const src = actx.createBufferSource(); src.buffer = actx.createBuffer(1, 1, 22050); src.connect(actx.destination); src.start(0); } catch (e) {}
  }
}
['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => addEventListener(ev, ensureAudio, { passive: true }));

// ---------- Фоновая музыка (чиптюн, своя мелодия на каждый уровень)
const MUSIC = {
  kitchen: { bpm: 150,
    lead: [72,0,76,79, 0,76,72,0, 74,0,77,81, 0,77,74,0, 72,0,76,79, 84,0,83,79, 77,76,74,72, 74,0,0,0],
    bass: [48,0,55,0, 48,0,55,0, 50,0,57,0, 50,0,57,0, 48,0,55,0, 52,0,55,0, 53,0,55,0, 55,0,43,0] },
  basement: { bpm: 132,
    lead: [69,0,72,0, 76,0,74,72, 71,0,74,0, 77,0,76,74, 72,0,69,0, 72,76,79,77, 76,0,74,0, 71,0,0,0],
    bass: [45,0,45,57, 45,0,45,57, 43,0,43,55, 43,0,43,55, 41,0,41,53, 41,0,41,53, 40,0,40,52, 40,0,44,0] },
  bathroom: { bpm: 140,
    lead: [67,71,74,0, 71,74,79,0, 76,74,72,71, 72,0,0,0, 69,72,76,0, 72,76,81,0, 79,78,76,74, 71,0,0,0],
    bass: [43,0,50,0, 43,0,50,0, 48,0,55,0, 48,0,55,0, 45,0,52,0, 45,0,52,0, 50,0,57,0, 50,0,38,0] },
  storm: { bpm: 150,
    lead: [64,0,67,71, 0,67,64,0, 62,0,66,69, 0,66,62,0, 60,0,64,67, 72,0,71,67, 66,0,62,0, 59,0,0,0],
    bass: [40,40,52,40, 40,40,52,40, 38,38,50,38, 38,38,50,38, 36,36,48,36, 36,36,48,36, 35,35,47,35, 35,0,47,0] },
  septic: { bpm: 118,
    lead: [60,0,0,63, 0,0,62,0, 60,0,0,56, 0,0,55,0, 60,0,0,63, 0,0,66,0, 67,0,66,63, 62,0,0,0],
    bass: [36,0,36,0, 36,0,43,0, 32,0,32,0, 31,0,31,0, 36,0,36,0, 42,0,42,0, 43,0,43,0, 31,0,43,0] },
  boss: { bpm: 176,
    lead: [62,62,0,65, 62,0,68,0, 67,0,65,0, 62,0,61,0, 62,62,0,65, 62,0,70,0, 69,0,68,0, 67,0,65,0],
    bass: [38,0,38,50, 38,0,38,50, 37,0,37,49, 37,0,37,49, 36,0,36,48, 36,0,36,48, 35,0,35,47, 37,0,49,0] },
  sewer: { bpm: 160,
    lead: [62,0,65,0, 69,0,68,0, 62,0,65,0, 70,0,69,0, 62,0,65,69, 74,0,73,0, 70,69,65,62, 61,0,0,0],
    bass: [38,38,0,38, 38,0,50,0, 38,38,0,38, 39,0,51,0, 38,38,0,38, 38,0,50,0, 34,0,46,0, 37,0,49,0] },
};
let musicTheme = null, musicStep = 0, musicNext = 0;
function note(midi, t, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(440 * Math.pow(2, (midi - 69) / 12), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function musicTick() {
  if (!actx || actx.state !== 'running') return;
  const playing = !muted && (G.state === 'play' || G.state === 'intro' || G.state === 'title');
  const bossOn = G.state === 'play' && G.lvl && G.lvl.boss && G.lvl.boss.awake && !G.lvl.boss.dead;
  const want = playing ? (bossOn ? 'boss' : G.lvl ? G.lvl.def.theme : 'kitchen') : null;
  if (want !== musicTheme) { musicTheme = want; musicStep = 0; musicNext = actx.currentTime + 0.08; }
  if (!want) return;
  const m = MUSIC[want], dt = 60 / m.bpm / 2;
  if (musicNext < actx.currentTime - 0.1) musicNext = actx.currentTime + 0.05;
  while (musicNext < actx.currentTime + 0.25) {
    const l = m.lead[musicStep % m.lead.length], b = m.bass[musicStep % m.bass.length];
    if (l) note(l, musicNext, dt * 0.85, 'square', 0.022);
    if (b) note(b, musicNext, dt * 0.9, 'triangle', 0.07);
    if (musicStep % 2 === 0) noise(0.03, musicStep % 8 === 4 ? 0.05 : 0.02, 6000, musicNext - actx.currentTime);
    musicStep++; musicNext += dt;
  }
}
setInterval(musicTick, 50);
function toggleMute() { muted = !muted; store('vz_muted', muted ? '1' : '0'); }
function tone(f1, f2, dur, type = 'square', vol = 0.06, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol = 0.1, freq = 800, delay = 0) {
  if (!actx || muted) return;
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = actx.currentTime + delay, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {

  sewer:    { style:'brick', bg1:'#21382c', bg2:'#0a1410', far:'#2b4637', mid:'#1f3428', wall:'#7d4c3b', wall2:'#6a3f31', grout:'#3a2219', top:'#5f8f35',
              pipe:'#6b8a78', pipeHi:'#a8c4b2', pipeLo:'#3c5244', dark:0.5, liq:['#556b22', '#6f8a2a', '#46591b', '#a2b84a'] },
};

const SOLID = new Set(['#', '[', ']', '(', ')', '=', 'C', 'Q', 'B', 'P', 'L', 'b']);
const ENEMY_DEF = {
  r: { w: 26, h: 16, sp: 1.7, edge: true, pts: 100 },
  g: { w: 26, h: 22, sp: 0.6, edge: false, pts: 100 },
  k: { w: 22, h: 12, sp: 2.6, edge: true, pts: 150 },
  h: { w: 24, h: 24, sp: 1.0, edge: true, pts: 200 },
};

function buildLevel(idx) {
  const def = LEVELS[idx], w = def.w, H = ROWS;
  const grid = []; for (let y = 0; y < H; y++) grid.push(new Array(w).fill(' '));
  const plats = [], signs = [];
  let arena = null;
  const b = {
    boss(x1, x2) { arena = { x1, x2 }; b.fill(x2 + 1, 0, x2 + 1, 13, 'Q'); },
    set(x, y, c) { if (x >= 0 && x < w && y >= 0 && y < H) grid[y][x] = c; },
    fill(x1, y1, x2, y2, c) { for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) b.set(x, y, c); },
    row(x1, x2, y, c) { b.fill(x1, y, x2, y, c); },
    col(x, y1, y2, c) { b.fill(x, y1, x, y2, c); },
    g(x1, x2, top = 14) { b.fill(x1, top, x2, H - 1, '#'); },
    pipe(x, top, bot = 13) { b.set(x, top, '['); b.set(x + 1, top, ']'); for (let y = top + 1; y <= bot; y++) { b.set(x, y, '('); b.set(x + 1, y, ')'); } },
    plat(x, y, axis = 'h', range = 4) { plats.push({ sx: x * T, sy: y * T, axis, range: range * T, w: 96, h: 12, x: x * T, y: y * T, dx: 0, dy: 0 }); },
    sign(x, kb, touch, y = 13) { signs.push({ x: x * T + 16, y: (y + 1) * T, text: isTouch ? touch : kb }); },
  };
  def.build(b);
  const L = { def, w, grid, plats, signs, nuts: [], enemies: [], drips: [], drops: [], flags: [], exit: null,
              start: { x: 100, y: 400 }, clogHp: new Map(), bumps: new Map(), boss: null, theme: THEMES[def.theme] };
  for (let y = 0; y < H; y++) for (let x = 0; x < w; x++) {
    const c = grid[y][x];
    if (c === 'S') { L.start = { x: x * T + 5, y: (y + 1) * T - 30 }; grid[y][x] = ' '; }
    else if (c === 'o') { L.nuts.push({ x: x * T + 16, y: y * T + 16, taken: false }); grid[y][x] = ' '; }
    else if (ENEMY_DEF[c]) { L.enemies.push(makeEnemy(c, x, y)); grid[y][x] = ' '; }
    else if (c === 'd') { L.drips.push({ x: x * T + 16, y: y * T, t: Math.floor(Math.random() * 100) }); grid[y][x] = ' '; }
    else if (c === 'F') { L.flags.push({ x: x * T + 16, y: (y + 1) * T, active: false, spin: 0 }); grid[y][x] = ' '; }
    else if (c === 'E') { L.exit = { x: x * T - 16, y: y * T - 32, w: 64, h: 64 }; grid[y][x] = ' '; }
  }
  if (arena && def.boss) L.boss = makeBoss(arena.x1, arena.x2, def.boss);
  return L;
}

function makeBoss(x1, x2, key) {
  const c = BOSSES[key];
  return { key, c, name: c.name, w: c.w, h: c.h, x: (x2 - 3) * T - c.w / 2, y: 14 * T - c.h, vx: 0, vy: 0,
           hp: c.hp, max: c.hp, ax1: x1 * T, ax2: (x2 + 1) * T, gateL: x1 - 1, gateR: x2 + 1,
           awake: false, dead: false, deadT: 0, st: 'idle', t: 0, face: -1, inv: 0, flash: 0, mouth: 0,
           swing: -1, onGround: false, anim: 0 };
}

function makeEnemy(c, tx, ty) {
  const d = ENEMY_DEF[c];
  return { type: c, x: tx * T + (T - d.w) / 2, y: (ty + 1) * T - d.h, w: d.w, h: d.h, vx: -d.sp, vy: 0,
           sp: d.sp, edge: d.edge, pts: d.pts, active: false, dead: false, squash: 0, gone: false,
           onGround: false, t: Math.random() * 100, jumpT: 60 + Math.random() * 60 };
}

// ============================================================
//  Состояние игры
// ============================================================
const G = {
  state: 'title', levelIdx: 0, score: 0, nuts: 0, lives: 3, power: false,
  lvl: null, P: null, cam: { x: 0 }, cp: null, time: 0, timeFrac: 0, frame: 0,
  stateT: 0, parts: [], pops: [], items: [], jets: [], bshots: [], waves: [], hi: +(store('vz_hi') || 0), swingId: 0, shake: 0,
};

function newPlayer(x, y) {
  return { x, y, w: 22, h: 30, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, jumpBuf: 0, hp: 3,
           inv: 0, attack: 0, atkCd: 0, shootT: 0, dead: false, deathT: 0, anim: 0, ride: null, hitSet: null };
}

function loadLevel(idx, fromCheckpoint) {
  G.levelIdx = idx;
  G.lvl = buildLevel(idx);
  const L = G.lvl;
  let sx = L.start.x, sy = L.start.y;
  if (fromCheckpoint && G.cp && G.cp.level === idx) {
    sx = G.cp.x - 11; sy = G.cp.y - 30;
    for (const f of L.flags) if (Math.abs(f.x - G.cp.x) < 4) f.active = true;
  } else G.cp = null;
  G.P = newPlayer(sx, sy);
  G.time = L.def.time; G.timeFrac = 0;
  G.parts = []; G.pops = []; G.items = []; G.jets = []; G.bshots = []; G.waves = [];
  G.cam.x = clamp(sx - VW * 0.4, 0, L.w * T - VW);
}

function startGame() {
  G.score = 0; G.nuts = 0; G.lives = 3; G.power = false; G.cp = null;
  hidePanel(); lbStart(); hideIosHint();
  loadLevel(0, false);
  setState('intro');
}
function setState(s) { G.state = s; G.stateT = 0; }
function setPause(on) {
  if (on && G.state === 'play') { setState('pause'); showPause(); }
  else if (!on && G.state === 'pause') { hidePanel(); G.state = 'play'; }
}

// ============================================================
//  Утилиты
// ============================================================
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function tileAt(tx, ty) {
  const L = G.lvl;
  if (tx < 0 || tx >= L.w) return '#';
  if (ty < 0) ty = 0;
  if (ty >= ROWS) return ' ';
  return L.grid[ty][tx];
}
function setTile(tx, ty, c) { if (tx >= 0 && tx < G.lvl.w && ty >= 0 && ty < ROWS) G.lvl.grid[ty][tx] = c; }
function solid(c) { return SOLID.has(c); }

function particles(x, y, n, colors, spd = 3, grav = 0.25, size = 4, life = 40) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.5, grav, size: size * (0.5 + Math.random() * 0.8),
                   color: colors[(Math.random() * colors.length) | 0], life: life * (0.6 + Math.random() * 0.6), max: life });
  }
}
function popText(x, y, text, color = '#fff') { G.pops.push({ x, y, text, color, life: 50 }); }
function addScore(n, x, y) { G.score += n; if (x !== undefined) popText(x, y, '+' + n); }
function addNut(x, y) {
  G.nuts++; G.score += 10; SFX.nut();
  if (G.nuts >= 100) { G.nuts -= 100; G.lives++; SFX.oneup(); popText(x, y - 10, '+1 ЖИЗНЬ', '#7CFC9A'); }
}

// ============================================================
//  Физика тел
// ============================================================
function moveBody(o, dropThrough) {
  o.hitWall = 0; o.hitHead = null;
  // X
  o.x += o.vx;
  let t = Math.floor(o.y / T), b = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) {
    const r = Math.floor((o.x + o.w - 0.01) / T);
    for (let ty = t; ty <= b; ty++) if (solid(tileAt(r, ty))) { o.x = r * T - o.w; o.vx = 0; o.hitWall = 1; break; }
  } else if (o.vx < 0) {
    const l = Math.floor(o.x / T);
    for (let ty = t; ty <= b; ty++) if (solid(tileAt(l, ty))) { o.x = (l + 1) * T; o.vx = 0; o.hitWall = -1; break; }
  }
  // Y
  const prevBottom = o.y + o.h;
  o.y += o.vy; o.onGround = false;
  const l = Math.floor(o.x / T), r = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const by = Math.floor((o.y + o.h - 0.01) / T);
    for (let tx = l; tx <= r; tx++) {
      const c = tileAt(tx, by);
      if (solid(c) || (c === '-' && !dropThrough && prevBottom <= by * T + 0.5)) { o.y = by * T - o.h; o.vy = 0; o.onGround = true; break; }
    }
  } else if (o.vy < 0) {
    const ty = Math.floor(o.y / T);
    const cx = Math.floor((o.x + o.w / 2) / T);
    let hit = null;
    if (solid(tileAt(cx, ty))) hit = cx;
    else for (let tx = l; tx <= r; tx++) if (solid(tileAt(tx, ty))) { hit = tx; break; }
    if (hit !== null) { o.y = (ty + 1) * T; o.vy = 0; o.hitHead = { tx: hit, ty }; }
  }
  return prevBottom;
}

// ============================================================
//  Засоры и ящики
// ============================================================
function damageTile(tx, ty, swing) {
  const c = tileAt(tx, ty), L = G.lvl;
  const cx = tx * T + 16, cy = ty * T + 16;
  if (c === 'C') {
    const k = tx + ',' + ty, hp = (L.clogHp.has(k) ? L.clogHp.get(k) : 2) - 1;
    if (hp <= 0) {
      setTile(tx, ty, ' '); L.clogHp.delete(k);
      particles(cx, cy, 22, ['#5a3b1e', '#3d2a17', '#8a6a3a', '#c9b37a', '#2b211a'], 5, 0.3, 6, 50);
      addScore(50, cx, cy); SFX.breakC(); G.shake = 6;
    } else {
      L.clogHp.set(k, hp); L.bumps.set(k, 8);
      particles(cx, cy, 8, ['#5a3b1e', '#8a6a3a'], 3, 0.3, 4, 30); SFX.plop();
    }
    return true;
  }
  return false;
}

function hitBlockFromBelow(tx, ty) {
  const c = tileAt(tx, ty), L = G.lvl, k = tx + ',' + ty;
  const cx = tx * T + 16, cy = ty * T;
  if (c === 'B' || c === 'P' || c === 'L') {
    setTile(tx, ty, 'b'); L.bumps.set(k, 8);
    if (c === 'B') { G.items.push({ type: 'nutpop', x: cx, y: cy - 8, vy: -7, life: 30 }); addNut(cx, cy); }
    else if (c === 'P') { G.items.push({ type: 'gun', x: cx - 12, y: cy, w: 24, h: 24, rise: 24, vy: 0 }); SFX.power(); }
    else { G.items.push({ type: 'heart', x: cx - 11, y: cy, w: 22, h: 20, rise: 22, vy: 0 }); SFX.heart(); }
    bumpEnemiesAbove(tx, ty);
  } else if (c === 'C') {
    damageTile(tx, ty);
  } else {
    L.bumps.set(k, 6); SFX.bump();
  }
}
function bumpEnemiesAbove(tx, ty) {
  const box = { x: tx * T, y: ty * T - 8, w: T, h: 8 };
  for (const e of G.lvl.enemies) if (!e.dead && !e.squash && overlap(box, e)) killEnemy(e, 0);
}

function killEnemy(e, dir) {
  e.dead = true; e.vy = -6; e.vx = dir * 2;
  addScore(e.pts, e.x + e.w / 2, e.y);
  particles(e.x + e.w / 2, e.y + e.h / 2, 8, ['#ffffff', '#cfe8ff'], 3, 0.2, 3, 25);
}

// ============================================================
//  Обновление
// ============================================================
function update() {
  G.frame++; G.stateT++;
  if (pressed.mute) toggleMute();
  switch (G.state) {
    case 'title':
      G.cam.x += 1.2; if (G.lvl && G.cam.x > G.lvl.w * T - VW) G.cam.x = 0;
      updatePlatforms();
      if (pressed.start || pressed.jump || pressed.act) startGame();
      break;
    case 'intro':
      if (G.stateT > 110 || (G.stateT > 20 && (pressed.start || pressed.jump))) setState('play');
      break;
    case 'play':
      if (pressed.pause) { setPause(true); break; }
      updatePlay();
      break;
    case 'pause':
      if (pressed.pause || pressed.start) setPause(false);
      break;
    case 'clear':
      updateClear();
      updateParticles();
      break;
    case 'dying':
      updateDying();
      updateParticles();
      break;
    case 'gameover': case 'victory':
      updateParticles();
      break;
  }
  for (const k in pressed) pressed[k] = false;
}

function updatePlatforms() {
  const L = G.lvl; if (!L) return;
  for (const p of L.plats) {
    const ph = (1 - Math.cos(G.frame * (Math.PI * 2 / 260))) / 2;
    const nx = p.axis === 'h' ? p.sx + ph * p.range : p.sx;
    const ny = p.axis === 'v' ? p.sy - ph * p.range : p.sy;
    p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
  }
}

function updatePlay() {
  const L = G.lvl, P = G.P;
  updatePlatforms();

  // таймер
  if (++G.timeFrac >= 60) { G.timeFrac = 0; G.time--; if (G.time <= 0) { G.time = 0; killPlayer(); return; } }

  // --- игрок
  const dir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  const maxV = 4.6, acc = P.onGround ? 0.6 : 0.42;
  if (dir) { P.vx = clamp(P.vx + dir * acc, -maxV, maxV); P.face = dir; }
  else { P.vx *= P.onGround ? 0.72 : 0.94; if (Math.abs(P.vx) < 0.1) P.vx = 0; }
  if (pressed.jump) P.jumpBuf = 8; else if (P.jumpBuf > 0) P.jumpBuf--;
  P.coyote = P.onGround ? 6 : P.coyote - 1;
  if (P.jumpBuf > 0 && P.coyote > 0) {
    P.vy = -12.4; P.jumpBuf = 0; P.coyote = 0; P.onGround = false; P.ride = null; P.jT = 0; SFX.jump();
  }
  P.vy += GRAV;
  P.jT = (P.jT || 0) + 1;
  if (!keys.jump && P.vy < 0 && P.jT > 7) P.vy += GRAV * 1.1;
  P.vy = Math.min(P.vy, MAXFALL);

  if (P.ride) { P.x += P.ride.dx; P.y = P.ride.y - P.h; }
  const dropThrough = keys.down && P.onGround;
  const prevBottom = moveBody(P, dropThrough);
  if (P.hitHead) hitBlockFromBelow(P.hitHead.tx, P.hitHead.ty);

  // подвижные платформы
  P.ride = null;
  if (P.vy >= 0 && !dropThrough) for (const p of L.plats) {
    if (P.x + P.w > p.x + 2 && P.x < p.x + p.w - 2 && prevBottom <= p.y + Math.max(0, p.dy) + 1.5 && P.y + P.h >= p.y) {
      P.y = p.y - P.h; P.vy = 0; P.onGround = true; P.ride = p;
    }
  }
  if (P.x < 0) P.x = 0;
  P.anim += Math.abs(P.vx) * 0.25 + 0.1;
  if (P.inv > 0) P.inv--;

  // атака
  if (P.atkCd > 0) P.atkCd--;
  if (P.shootT > 0) P.shootT--;
  if (pressed.act && P.atkCd <= 0) {
    if (G.power) {
      if (G.jets.length < 4) {
        G.jets.push({ x: P.x + (P.face > 0 ? P.w + 6 : -6), y: P.y + 16, vx: P.face * 9.5, life: 55 });
        P.atkCd = 13; P.shootT = 10; SFX.shoot();
      }
    } else {
      P.attack = 14; P.atkCd = 20; G.swingId++; P.hitSet = new Set(); SFX.swing();
    }
  }
  if (P.attack > 0) {
    P.attack--;
    if (P.attack <= 11 && P.attack >= 5) {
      const hb = P.face > 0 ? { x: P.x + P.w - 4, y: P.y + 6, w: 32, h: 20 } : { x: P.x - 28, y: P.y + 6, w: 32, h: 20 };
      if (P.attack === 11) {
        const tx1 = Math.floor(hb.x / T), tx2 = Math.floor((hb.x + hb.w - 1) / T);
        const ty1 = Math.floor(hb.y / T), ty2 = Math.floor((hb.y + hb.h - 1) / T);
        for (let ty = ty1; ty <= ty2; ty++) for (let tx = tx1; tx <= tx2; tx++) damageTile(tx, ty, G.swingId);
      }
      for (const e of L.enemies) if (!e.dead && !e.squash && e.active && !P.hitSet.has(e) && overlap(hb, e)) {
        P.hitSet.add(e); killEnemy(e, P.face); SFX.plop();
      }
      const B = L.boss;
      if (B && !B.dead && B.swing !== G.swingId && overlap(hb, B)) { B.swing = G.swingId; hitBoss(B, P.face); }
    }
  }

  // жижа и падение
  if (P.y > ROWS * T + 40) { killPlayer(); return; }
  {
    const fy = Math.floor((P.y + P.h - 2) / T);
    const lx = Math.floor((P.x + 4) / T), rx = Math.floor((P.x + P.w - 4) / T);
    for (let tx = lx; tx <= rx; tx++) if (tileAt(tx, fy) === '~' && P.y + P.h > fy * T + 10) {
      particles(P.x + P.w / 2, fy * T + 8, 20, ['#6f7f2a', '#8a9a3a', '#4e5a1e'], 4, 0.3, 5, 40); SFX.splash();
      killPlayer(); return;
    }
  }

  // гайки
  for (const n of L.nuts) if (!n.taken && Math.abs(n.x - (P.x + P.w / 2)) < 20 && Math.abs(n.y - (P.y + P.h / 2)) < 24) {
    n.taken = true; addNut(n.x, n.y);
    particles(n.x, n.y, 6, ['#ffe066', '#fff3b0'], 2, 0, 3, 20);
  }

  // чекпоинты
  for (const f of L.flags) if (!f.active && Math.abs(f.x - (P.x + P.w / 2)) < 20 && P.y + P.h > f.y - 64) {
    f.active = true; G.cp = { level: G.levelIdx, x: f.x, y: f.y }; SFX.check();
    popText(f.x, f.y - 70, 'СОХРАНЕНО', '#7CFC9A');
    if (P.hp < 3) P.hp = 3;
  }

  // предметы
  updateItems();
  // струи
  updateJets();
  // враги
  updateEnemies();
  // капли
  updateDrips();
  // босс
  updateBoss();
  if (G.state !== 'play') return;
  updateParticles();
  for (const [k, v] of L.bumps) { if (v <= 1) L.bumps.delete(k); else L.bumps.set(k, v - 1); }
  for (const f of L.flags) if (f.active) f.spin += 0.08;
  if (G.shake > 0) G.shake--;

  // финиш
  if (L.exit && (!L.boss || L.boss.dead) && overlap(P, { x: L.exit.x + 6, y: L.exit.y + 8, w: 52, h: 56 })) {
    setState('clear'); G.clearBonus = G.time; SFX.clear();
    P.vx = 0;
    particles(L.exit.x + 32, L.exit.y + 32, 40, ['#4fa3ff', '#9fd4ff', '#ffffff'], 6, 0.2, 5, 60);
  }

  // камера
  const target = clamp(P.x + P.w / 2 - VW * 0.42, 0, L.w * T - VW);
  G.cam.x += (target - G.cam.x) * 0.14;
}

// ============================================================
//  Босс уровня
// ============================================================
const BOSS_PREP = { spit: 40, jump: 26, charge: 44, summon: 42, rain: 46 };
function bossNext(B) {
  const rage = B.hp <= B.max / 2;
  if (B.st === 'walk') {
    const list = B.c.attacks;
    let a = list[(Math.random() * list.length) | 0];
    if (a === B.last && list.length > 1) a = list[(Math.random() * list.length) | 0];
    if (a === 'summon' && G.lvl.enemies.filter(e => e.fromBoss && !e.dead).length >= 3) a = 'spit';
    B.last = a; B.st = a + 'Prep'; B.t = Math.round(BOSS_PREP[a] * (rage ? 0.7 : 1));
  } else {
    B.st = 'walk'; B.t = Math.round((45 + Math.random() * 55) * (rage ? 0.6 : 1));
  }
}

function updateBoss() {
  const L = G.lvl, B = L.boss, P = G.P;
  updateBossShots();
  if (!B) return;
  if (B.dead) { B.deadT++; return; }
  const pcx = P.x + P.w / 2, bcx = B.x + B.w / 2;
  if (!B.awake) {
    if (pcx > B.ax1 + 2.5 * T) {
      B.awake = true; B.st = 'roar'; B.t = 70; B.face = pcx < bcx ? -1 : 1;
      for (let y = 0; y <= 13; y++) setTile(B.gateL, y, 'Q');
      G.shake = 14; SFX.roar();
      popText(bcx, B.y - 20, B.name.toUpperCase() + '!', '#ff8a5a');
    }
    return;
  }
  const rage = B.hp <= B.max / 2 ? 1.4 : 1;
  if (B.inv > 0) B.inv--;
  if (B.flash > 0) B.flash--;
  if (B.mouth > 0) B.mouth--;
  B.anim++; B.t--;
  const faceP = () => { B.face = pcx < bcx ? -1 : 1; };
  const mouthX = () => bcx + B.face * B.w * 0.3, mouthY = B.y + B.h * 0.62;
  switch (B.st) {
    case 'roar': B.vx = 0; B.mouth = 2; if (B.anim % 10 === 0) G.shake = 4; if (B.t <= 0) { B.st = 'spitPost'; B.t = 10; } break;
    case 'walk': {
      faceP();
      const gap = Math.abs(pcx - bcx) - B.w / 2 - P.w / 2; // держит дистанцию, а не впечатывается в игрока
      B.vx = gap > 46 ? B.face * B.c.speed * rage : 0;
      if (B.t <= 0) bossNext(B);
      break;
    }
    case 'spitPrep': B.vx = 0; faceP(); B.mouth = 2; if (B.t <= 0) {
      const n = rage > 1 ? 3 : (B.key === 'city' ? 2 : 1);
      const mx = mouthX(), my = mouthY;
      for (let i = 0; i < n; i++) {
        const base = clamp((pcx - mx) / 52, -7, 7);
        G.bshots.push({ x: mx, y: my, vx: base + (i - (n - 1) / 2) * 1.6, vy: -8.5 - Math.random(), r: 9, kind: 'clog' });
      }
      SFX.spit(); B.st = 'spitPost'; B.t = 28;
    } break;
    case 'spitPost': B.vx = 0; if (B.t <= 0) bossNext(B); break;
    case 'jumpPrep': B.vx = 0; faceP(); if (B.t <= 0) {
      B.vy = -12.5 - (rage > 1 ? 1 : 0); B.vx = clamp((pcx - bcx) / 46, -6.5, 6.5); B.st = 'jumpAir'; B.onGround = false; SFX.jump();
    } break;
    case 'jumpAir': if (B.onGround && B.vy >= 0) {
      B.st = 'land'; B.t = 34; B.vx = 0; G.shake = 16; SFX.slam();
      const gy = B.y + B.h;
      G.waves.push({ x: bcx - B.w / 2, y: gy, dir: -1, life: 80 }, { x: bcx + B.w / 2, y: gy, dir: 1, life: 80 });
      particles(bcx, gy, 24, [B.c.body, B.c.dark, '#8a6a3a'], 5, 0.3, 6, 40);
    } break;
    case 'land': B.vx = 0; if (B.t <= 0) bossNext(B); break;
    case 'chargePrep': B.vx = 0; faceP(); if (B.anim % 6 === 0) SFX.tick(); if (B.t <= 0) { B.st = 'charge'; B.t = 100; SFX.roar(); } break;
    case 'charge': B.vx = B.face * 7.2 * Math.min(rage, 1.2);
      if (B.anim % 4 === 0) particles(bcx - B.face * B.w / 2, B.y + B.h, 3, [B.c.dark, '#8a6a3a'], 2, 0.2, 4, 20);
      if (B.hitWall || B.t <= 0) {
        if (B.hitWall) {
          G.shake = 18; SFX.slam();
          for (let i = 0; i < 4 + (rage > 1 ? 2 : 0); i++)
            G.bshots.push({ x: B.ax1 + 40 + Math.random() * (B.ax2 - B.ax1 - 80), y: -20 - Math.random() * 160, vx: 0, vy: 1, r: 8, kind: 'rock' });
        }
        B.st = 'stun'; B.t = 75; B.vx = 0;
      } break;
    case 'stun': B.vx = 0; if (B.t <= 0) bossNext(B); break;
    case 'hurt': B.vx = 0; if (B.t <= 0) { B.st = 'walk'; bossNext(B); } break; // после заминки — сразу контратака
    case 'summonPrep': B.vx = 0; faceP(); B.mouth = 2; if (B.t <= 0) {
      for (let i = 0; i < 2; i++) {
        const e = makeEnemy(Math.random() < 0.5 ? 'r' : 'k', 0, 0);
        e.x = mouthX() - e.w / 2; e.y = B.y + B.h - e.h - 4; e.vx = B.face * e.sp * (i ? 1 : 0.7); e.vy = -5 - i * 2;
        e.active = true; e.fromBoss = true; L.enemies.push(e);
      }
      SFX.spit(); B.st = 'spitPost'; B.t = 40;
    } break;
    case 'rainPrep': B.vx = 0; B.mouth = 2; if (B.anim % 8 === 0) G.shake = 3; if (B.t <= 0) {
      const n = 7 + (rage > 1 ? 4 : 0);
      for (let i = 0; i < n; i++) L.drops.push({ x: B.ax1 + 24 + Math.random() * (B.ax2 - B.ax1 - 48), y: -20 - Math.random() * 260, vy: 0 });
      SFX.splash(); B.st = 'spitPost'; B.t = 50;
    } break;
    default: B.st = 'walk'; B.t = 40;
  }
  B.vy = Math.min(B.vy + GRAV, MAXFALL);
  if (B.recoil) { B.vx += B.recoil; B.recoil *= 0.8; if (Math.abs(B.recoil) < 0.3) B.recoil = 0; }
  moveBody(B);
  if (B.x < B.ax1) { B.x = B.ax1; B.hitWall = -1; }
  if (B.x + B.w > B.ax2) { B.x = B.ax2 - B.w; B.hitWall = 1; }

  // столкновение с игроком
  if (!P.dead && overlap(P, B)) {
    const pb = P.y + P.h - P.vy;
    if (P.vy > 0 && pb <= B.y + 20) {
      P.vy = keys.jump ? -12 : -9.5; P.coyote = 0; P.y = B.y - P.h - 1;
      SFX.stomp(); hitBoss(B, P.x + P.w / 2 < bcx ? 1 : -1);
    } else if ((B.st === 'walk' && Math.abs(B.vx) > 0.1) || B.st === 'charge' || B.st === 'jumpAir') {
      hurtPlayer(bcx);
      if (!P.dead) P.vx = (pcx < bcx ? -1 : 1) * 6;
    }
  }
}

function hitBoss(B, dir) {
  if (B.dead || B.inv > 0) return false;
  if (!B.awake) { B.awake = true; B.st = 'roar'; B.t = 40; for (let y = 0; y <= 13; y++) setTile(B.gateL, y, 'Q'); }
  B.hp--; B.inv = 22; B.flash = 10;
  // отскок и короткая заминка, чтобы игрок успел отойти
  if (B.st !== 'jumpAir' && B.st !== 'charge') { B.recoil = dir * 5; if (B.st === 'walk') { B.st = 'hurt'; B.t = 16; } }
  particles(B.x + B.w / 2, B.y + B.h / 2, 12, [B.c.body, B.c.hi, B.c.dark], 4, 0.3, 5, 40);
  SFX.bossHit(); G.shake = 6;
  if (B.hp === Math.floor(B.max / 2)) popText(B.x + B.w / 2, B.y - 20, 'ОН В ЯРОСТИ!', '#ff5a3a');
  if (B.hp <= 0) bossDie(B);
  return true;
}

function bossDie(B) {
  B.dead = true; B.deadT = 0;
  const cx = B.x + B.w / 2, cy = B.y + B.h / 2;
  for (let i = 0; i < 6; i++) particles(cx + (Math.random() - 0.5) * B.w, cy + (Math.random() - 0.5) * B.h, 14,
    [B.c.body, B.c.hi, B.c.dark, '#c9b37a', '#4fa3ff', '#9fd4ff'], 7, 0.3, 7, 70);
  for (let y = 0; y <= 13; y++) {
    if (tileAt(B.gateL, y) === 'Q') setTile(B.gateL, y, ' ');
    if (tileAt(B.gateR, y) === 'Q') setTile(B.gateR, y, ' ');
  }
  for (const e of G.lvl.enemies) if (e.fromBoss && !e.dead) killEnemy(e, 0);
  G.bshots = []; G.waves = [];
  addScore(1000 + 500 * G.levelIdx, cx, B.y);
  SFX.bossDie(); G.shake = 22;
  popText(cx, B.y - 30, 'ЗАСОР ПРОБИТ!', '#7fd4ff');
  popText(cx, B.y - 6, 'Путь к сливу открыт →', '#ffffff');
}

function updateBossShots() {
  const P = G.P;
  for (const s of G.bshots) {
    s.vy = Math.min(s.vy + (s.kind === 'rock' ? 0.3 : 0.35), 10); s.x += s.vx; s.y += s.vy;
    const c = tileAt(Math.floor(s.x / T), Math.floor((s.y + s.r * 0.6) / T));
    if (s.y > 0 && (solid(c) || c === '~')) { s.gone = true; particles(s.x, s.y, 8, ['#5a3b1e', '#3d2a17', '#8a6a3a'], 3, 0.3, 4, 25); }
    if (!P.dead && s.x > P.x - s.r + 3 && s.x < P.x + P.w + s.r - 3 && s.y > P.y - s.r + 3 && s.y < P.y + P.h + s.r - 3) { s.gone = true; hurtPlayer(s.x); }
    if (s.y > VH + 40) s.gone = true;
  }
  G.bshots = G.bshots.filter(s => !s.gone);
  for (const w of G.waves) {
    w.x += w.dir * 5.5; w.life--;
    const B = G.lvl.boss;
    if (B && (w.x < B.ax1 || w.x > B.ax2)) w.life = 0;
    if (!solid(tileAt(Math.floor(w.x / T), Math.floor((w.y + 4) / T)))) w.life = 0;
    if (!P.dead && P.x < w.x + 10 && P.x + P.w > w.x - 10 && P.y + P.h > w.y - 22 && P.y < w.y) hurtPlayer(w.x - w.dir * 20);
  }
  G.waves = G.waves.filter(w => w.life > 0);
}

function updateItems() {
  const P = G.P;
  for (const it of G.items) {
    if (it.type === 'nutpop') { it.y += it.vy; it.vy += 0.5; if (--it.life <= 0) it.gone = true; continue; }
    if (it.rise > 0) { it.y -= 1; it.rise--; continue; }
    it.vy = Math.min(it.vy + GRAV, MAXFALL);
    if (it.dir === undefined) it.dir = P.x + P.w / 2 < it.x + it.w / 2 ? 1 : -1;
    it.vx = it.dir * 1.4; moveBody(it);
    if (it.hitWall) it.dir = -it.dir;
    if (it.y > ROWS * T + 50) it.gone = true;
    if (!P.dead && overlap(P, it)) {
      it.gone = true;
      if (it.type === 'gun') { G.power = true; SFX.power(); popText(it.x + 12, it.y - 10, 'ГИДРОМАШИНА!', '#7fd4ff'); addScore(500); }
      else { P.hp = Math.min(3, P.hp + 1); if (P.hp === 3) addScore(300); SFX.heart(); popText(it.x + 11, it.y - 10, '+♥', '#ff6b81'); }
    }
  }
  G.items = G.items.filter(i => !i.gone);
}

function updateJets() {
  const L = G.lvl;
  for (const j of G.jets) {
    j.x += j.vx; j.life--;
    if (G.frame % 2 === 0) G.parts.push({ x: j.x, y: j.y, vx: -j.vx * 0.05, vy: Math.random() - 0.5, grav: 0.1, size: 3, color: '#9fd4ff', life: 14, max: 14 });
    const tx = Math.floor(j.x / T), ty = Math.floor(j.y / T), c = tileAt(tx, ty);
    if (solid(c)) {
      if (c === 'C') damageTile(tx, ty);
      particles(j.x, j.y, 8, ['#4fa3ff', '#9fd4ff', '#fff'], 3, 0.2, 3, 22); j.life = 0;
    }
    for (const e of L.enemies) if (!e.dead && !e.squash && e.active && j.life > 0 &&
        j.x > e.x - 4 && j.x < e.x + e.w + 4 && j.y > e.y - 6 && j.y < e.y + e.h + 6) {
      killEnemy(e, Math.sign(j.vx)); j.life = 0; SFX.plop();
    }
    const B = L.boss;
    if (B && !B.dead && j.life > 0 && j.x > B.x && j.x < B.x + B.w && j.y > B.y && j.y < B.y + B.h) {
      hitBoss(B, Math.sign(j.vx)); j.life = 0;
      particles(j.x, j.y, 8, ['#4fa3ff', '#9fd4ff', '#fff'], 3, 0.2, 3, 22);
    }
    for (const sh of G.bshots) if (j.life > 0 && Math.abs(sh.x - j.x) < 14 && Math.abs(sh.y - j.y) < 14) { sh.gone = true; j.life = 0; particles(sh.x, sh.y, 8, ['#5a3b1e', '#8a6a3a'], 3, 0.3, 4, 25); }
  }
  G.jets = G.jets.filter(j => j.life > 0);
}

function updateEnemies() {
  const L = G.lvl, P = G.P;
  for (const e of L.enemies) {
    if (e.gone) continue;
    if (!e.active) { if (e.x < G.cam.x + VW + 64) e.active = true; else continue; }
    if (e.dead) { e.vy += GRAV; e.y += e.vy; e.x += e.vx; if (e.y > VH + 100) e.gone = true; continue; }
    if (e.squash) { if (--e.squash <= 0) e.gone = true; continue; }
    e.t++;
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    if (e.type === 'h' && e.onGround && --e.jumpT <= 0) { e.vy = -8.5; e.jumpT = 70 + Math.random() * 70; }
    if (e.edge && e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      const c = tileAt(Math.floor(fx / T), Math.floor((e.y + e.h + 4) / T));
      if (!solid(c) && c !== '-') e.vx = -e.vx;
    }
    const vx = e.vx;
    moveBody(e);
    if (e.hitWall) e.vx = -vx;
    if (e.y > ROWS * T + 64) { e.gone = true; continue; }
    const c = tileAt(Math.floor((e.x + e.w / 2) / T), Math.floor((e.y + e.h - 2) / T));
    if (c === '~') { e.gone = true; particles(e.x + e.w / 2, e.y + e.h, 10, ['#6f7f2a', '#8a9a3a'], 3, 0.3, 4, 30); continue; }

    if (!P.dead && overlap(P, e)) {
      const pb = P.y + P.h - P.vy;
      if (P.vy > 0 && pb <= e.y + 10) {
        e.squash = 30; P.vy = keys.jump ? -11 : -7.5; P.coyote = 0;
        addScore(e.pts, e.x + e.w / 2, e.y); SFX.stomp();
        particles(e.x + e.w / 2, e.y + e.h / 2, 10, enemyColors(e.type), 3, 0.3, 4, 30);
      } else hurtPlayer(e.x + e.w / 2);
    }
  }
  L.enemies = L.enemies.filter(e => !e.gone);
}
function enemyColors(t) {
  return t === 'r' ? ['#7b7f86', '#b5868f'] : t === 'g' ? ['#d8b54a', '#f0d77a', '#a8862a'] : t === 'k' ? ['#5a2e12', '#8a4e22'] : ['#2a2420', '#4a3c30'];
}

function updateDrips() {
  const L = G.lvl, P = G.P;
  for (const d of L.drips) {
    if (Math.abs(d.x - G.cam.x - VW / 2) > VW) continue;
    if (++d.t >= 130) { d.t = 0; L.drops.push({ x: d.x, y: d.y + 10, vy: 0.5 }); }
  }
  for (const dr of L.drops) {
    dr.vy = Math.min(dr.vy + 0.25, 9); dr.y += dr.vy;
    const c = tileAt(Math.floor(dr.x / T), Math.floor((dr.y + 6) / T));
    if (solid(c) || c === '~' || c === '-') { dr.gone = true; particles(dr.x, dr.y, 6, ['#9fbf3a', '#6f8f2a'], 2, 0.25, 3, 18); }
    if (!P.dead && dr.x > P.x - 3 && dr.x < P.x + P.w + 3 && dr.y + 6 > P.y && dr.y < P.y + P.h) { dr.gone = true; hurtPlayer(dr.x); }
    if (dr.y > VH + 20) dr.gone = true;
  }
  L.drops = L.drops.filter(d => !d.gone);
}

function updateParticles() {
  for (const p of G.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.parts.length > 600) G.parts.splice(0, G.parts.length - 600);
  for (const p of G.pops) { p.y -= 0.8; p.life--; }
  G.pops = G.pops.filter(p => p.life > 0);
}

function hurtPlayer(fromX) {
  const P = G.P;
  if (P.inv > 0 || P.dead) return;
  P.hp--; P.inv = 100;
  P.vx = (P.x + P.w / 2 < fromX ? -1 : 1) * 4; P.vy = -5;
  SFX.fart(); G.shake = 8;
  fartCloud(P);
  if (P.hp <= 0) killPlayer();
}

function fartCloud(P) {
  const x = P.x + P.w / 2 - P.face * 12, y = P.y + 22;
  for (let i = 0; i < 14; i++)
    G.parts.push({ x: x + (Math.random() - 0.5) * 8, y: y + (Math.random() - 0.5) * 6,
      vx: -P.face * (0.5 + Math.random() * 1.6), vy: -0.3 - Math.random() * 0.9, grav: -0.015,
      size: 6 + Math.random() * 8, color: ['#9bb83a', '#c8d86a', '#7a9a2a', '#b5c95a'][i % 4], life: 45 + Math.random() * 25, max: 70 });
  if (Math.random() < 0.6) popText(x - P.face * 10, y - 26, ['ПУК!', 'ПФФ!', 'ПРРР!'][(Math.random() * 3) | 0], '#c8e06a');
}

function killPlayer() {
  const P = G.P;
  if (P.dead) return;
  P.dead = true; P.deathT = 0; P.vy = -10; P.vx = 0; P.hp = 0;
  G.power = false;
  SFX.die();
  setState('dying');
}

function updateDying() {
  const P = G.P;
  P.deathT++;
  if (P.deathT > 25) { P.vy = Math.min(P.vy + 0.5, 12); P.y += P.vy; }
  if (P.deathT > 120) {
    G.lives--;
    if (G.lives <= 0) { setState('gameover'); saveHi(); showGameOver(); }
    else { loadLevel(G.levelIdx, true); setState('intro'); }
  }
}

function updateClear() {
  const P = G.P;
  // Вантузыч «уходит» в слив
  P.anim += 0.3;
  if (G.clearBonus > 0) {
    if (G.stateT > 40) {
      const step = Math.min(G.clearBonus, 3);
      G.clearBonus -= step; G.time -= step; G.score += step * 10;
      if (G.stateT % 3 === 0) SFX.tick();
    }
  } else if (!G.clearDoneT) G.clearDoneT = G.stateT;
  if (G.clearDoneT && G.stateT - G.clearDoneT > 80) {
    G.clearDoneT = 0;
    if (G.levelIdx + 1 < LEVELS.length) { G.cp = null; loadLevel(G.levelIdx + 1, false); setState('intro'); }
    else { setState('victory'); saveHi(); showVictory(); }
  }
}

function saveHi() { if (G.score > G.hi) { G.hi = G.score; store('vz_hi', String(G.hi)); } }

// ============================================================
//  HTML-панели
// ============================================================
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function ctaBlock(lead) {
  let tel = CONFIG.phone.replace(/[^\d+]/g, '');
  if (/^8\d{10}$/.test(tel)) tel = '+7' + tel.slice(1); // 8-XXX… → +7XXX… для ссылки tel:
  const promo = CONFIG.promo ? `<p class="muted">Ваш промокод на скидку:</p><div class="promo">${esc(CONFIG.promo)}</div>` : '';
  const url = CONFIG.url && CONFIG.url !== '#' ? `<a class="btn primary" href="${esc(CONFIG.url)}" target="_top" rel="noopener">${esc(CONFIG.cta)}</a>` : '';
  return `<p>${lead}</p>${promo}
    <a class="phone" href="tel:${esc(tel)}">${esc(CONFIG.phone)}</a>
    <p class="muted">${esc(CONFIG.company)}</p>
    <div class="btns">${url}<button class="btn ghost" id="again">Играть снова</button></div>`;
}
function bindAgain() { const b = document.getElementById('again'); if (b) { b.onclick = () => { ensureAudio(); startGame(); }; b.focus(); } }
function showPanel(html) { panel.innerHTML = `<div class="card">${html}</div>`; panel.classList.add('show'); document.body.classList.add('panel-open'); panel.scrollTop = 0; }
function hidePanel() { panel.classList.remove('show'); panel.innerHTML = ''; document.body.classList.remove('panel-open'); }
// ---------- Общая таблица рекордов (через leaderboard.php на сервере сайта)
const LB = { on: CONFIG.api && CONFIG.api !== 'off', ok: false, top: [], token: null, me: null };
function lbFetch(opts) {
  return fetch(CONFIG.api, Object.assign({ cache: 'no-store' }, opts || {})).then(r => r.json().then(d => { if (!r.ok) throw new Error(d && d.error || r.status); return d; }));
}
function lbPost(body) { return lbFetch({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
function lbLoad() {
  if (!LB.on || location.protocol === 'file:') return;
  lbFetch().then(d => { if (Array.isArray(d.top)) { LB.top = d.top; LB.ok = true; } }).catch(() => { LB.ok = false; });
}
function lbStart() {
  LB.token = null; LB.me = null;
  if (!LB.ok) return;
  lbPost({ action: 'start' }).then(d => { LB.token = d.token || null; }).catch(() => {});
  lbFetch().then(d => { if (Array.isArray(d.top)) LB.top = d.top; }).catch(() => {});
}
function lbQualifies(score) {
  if (!LB.ok || !LB.token || score <= 0) return false;
  return LB.top.length < 3 || score > LB.top[Math.min(2, LB.top.length - 1)].score;
}
function lbHtml() {
  if (!LB.ok) return '';
  const rows = LB.top.slice(0, 3).map((r, i) =>
    `<li class="${LB.me && LB.me.toLowerCase() === String(r.name).toLowerCase() ? 'me' : ''}"><span class="nm">${['🥇', '🥈', '🥉'][i]} ${esc(r.name)}</span><b>${Number(r.score).toLocaleString('ru')}</b></li>`).join('');
  return `<div class="lb" id="lbbox"><div class="lbt">Лучшие мастера</div><ol>${rows || '<li><span class="nm">Пока никого — будьте первым!</span></li>'}</ol></div>`;
}
function lbFormHtml() {
  if (!lbQualifies(G.score)) return '';
  const saved = store('vz_name') || '';
  return `<p class="lbmsg" id="lbask">Вы попали в тройку лучших! Впишите имя:</p>
    <form class="lbform" id="lbform"><input id="lbname" maxlength="16" placeholder="Ваше имя" value="${esc(saved)}" required autocomplete="nickname">
    <button class="btn primary" type="submit">Сохранить</button></form>`;
}
function bindLbForm() {
  const f = document.getElementById('lbform'); if (!f) return;
  const inp = document.getElementById('lbname');
  if (!isTouch) setTimeout(() => { try { inp.focus(); } catch (e) {} }, 50);
  f.onsubmit = ev => {
    ev.preventDefault();

  ctx.textAlign = align; ctx.textBaseline = 'middle';

  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function render() {
  const L = G.lvl;
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  if (L) {
    drawBackground(L.theme, G.cam.x);
    drawWorld(L);
  } else R(0, 0, VW, VH, '#000');
  ctx.restore();

  if (G.state === 'title') { drawTitle(); return; }
  drawHUD();
  if (G.state === 'intro') drawIntro();
  if (G.state === 'clear') drawClear();
}

function drawBackground(th, camx) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.bg1); g.addColorStop(1, th.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // дальний слой труб

  layer(camx * 0.45, 260, th.mid, 1, 2);
}
function layer(off, seg, col, alpha, seed) {
  ctx.globalAlpha = alpha;
  const i0 = Math.floor(off / seg) - 1, i1 = i0 + Math.ceil(VW / seg) + 2;
  const hiA = seed === 2 ? 0.1 : 0.06, loA = seed === 2 ? 0.22 : 0.16;
  for (let i = i0; i <= i1; i++) {
    const h1 = hash(i * 7 + seed), h2 = hash(i * 13 + seed * 3), h3 = hash(i * 29 + seed * 5);
    const x = i * seg - off;

    const pw = 22 + h1 * 26, px = x + h2 * (seg - pw);
    R(px, 0, pw, VH, col);
    ctx.fillStyle = `rgba(255,255,255,${hiA})`; ctx.fillRect(px + pw * 0.18, 0, pw * 0.16, VH);

    for (const fy of [120 + h3 * 200, 420 + h1 * 60]) {
      R(px - 4, fy, pw + 8, 10, col);
      ctx.fillStyle = `rgba(255,255,255,${hiA})`; ctx.fillRect(px - 4, fy, pw + 8, 2);
      ctx.fillStyle = `rgba(0,0,0,${loA})`; ctx.fillRect(px - 4, fy + 8, pw + 8, 2);
      ctx.fillStyle = `rgba(0,0,0,${loA * 1.4})`; for (let k = 0; k < 3; k++) ctx.fillRect(px + k * pw / 2 - 1, fy + 3, 3, 3);
    }
    // горизонтальная
    if (h3 > 0.35) {
      const py = 40 + hash(i * 3 + seed) * 300, ph = 14 + h1 * 14;
      R(x, py, seg + 1, ph, col);
      ctx.fillStyle = `rgba(255,255,255,${hiA})`; ctx.fillRect(x, py + ph * 0.2, seg + 1, ph * 0.18);
      ctx.fillStyle = `rgba(0,0,0,${loA})`; ctx.fillRect(x, py + ph * 0.72, seg + 1, ph * 0.28);
      R(x + seg * 0.5, py - 3, 8, ph + 6, col);
      ctx.fillStyle = `rgba(0,0,0,${loA * 1.4})`; ctx.fillRect(x + seg * 0.5 + 2, py, 3, 3); ctx.fillRect(x + seg * 0.5 + 2, py + ph - 3, 3, 3);
      if (h2 > 0.55) { // вентиль-штурвал

        R(vx - 2, vy, 4, 16, col);

        ctx.strokeStyle = `rgba(255,255,255,${hiA})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(vx, vy, 13, Math.PI, Math.PI * 1.6); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawWorld(L) {
  const camx = Math.round(G.cam.x), th = L.theme;
  const tx0 = Math.max(0, Math.floor(camx / T) - 1), tx1 = Math.min(L.w - 1, tx0 + Math.ceil(VW / T) + 2);
  // знаки (за тайлами)
  for (const s of L.signs) if (s.x - camx > -200 && s.x - camx < VW + 200) drawSign(s.x - camx, s.y, s.text);
  // флажки-вентили
  for (const f of L.flags) drawFlag(f.x - camx, f.y, f);
  // финиш
  if (L.exit) drawExit(L.exit.x - camx, L.exit.y, L.boss && !L.boss.dead);
  // тайлы
  for (let ty = 0; ty < ROWS; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const c = L.grid[ty][tx];
    if (c === ' ') continue;
    let y = ty * T;
    const bump = L.bumps.get(tx + ',' + ty);
    if (bump && c !== 'C') y -= Math.sin((bump / 8) * Math.PI) * 6;
    drawTile(c, tx * T - camx, y, tx, ty, th, bump);
  }
  if (L.boss && (!L.boss.dead || L.boss.deadT < 50)) drawBoss(L.boss, camx);
  for (const w of G.waves) drawWave(w.x - camx, w.y, w);
  for (const sh of G.bshots) drawBossShot(sh.x - camx, sh.y, sh);
  // капельницы
  for (const d of L.drips) drawDrip(d.x - camx, d.y, d.t);
  for (const dr of L.drops) drawDrop(dr.x - camx, dr.y);
  // платформы
  for (const p of L.plats) drawPlat(p.x - camx, p.y, p);
  // гайки
  for (const n of L.nuts) if (!n.taken) drawNut(n.x - camx, n.y + Math.sin(G.frame * 0.06 + n.x) * 2, G.frame * 0.08 + n.x * 0.01);
  // предметы
  for (const it of G.items) {
    if (it.type === 'nutpop') drawNut(it.x - camx, it.y, G.frame * 0.4);
    else if (it.type === 'gun') drawGunItem(it.x - camx, it.y);
    else drawHeart(it.x - camx + 11, it.y + 10, 10, '#ff4d6d');
  }
  // враги
  for (const e of L.enemies) if (e.active || e.x < camx + VW + 64) drawEnemy(e, camx);
  // игрок
  if (G.P && G.state !== 'title') drawHero(G.P, camx);
  // струи
  for (const j of G.jets) {
    const x = j.x - camx;
    ctx.fillStyle = '#4fa3ff'; ctx.beginPath(); ctx.ellipse(x, j.y, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d6efff'; ctx.beginPath(); ctx.ellipse(x + Math.sign(j.vx) * 2, j.y - 1, 4, 2, 0, 0, Math.PI * 2); ctx.fill();
  }
  // частицы
  for (const p of G.parts) { ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5); R(p.x - camx - p.size / 2, p.y - p.size / 2, p.size, p.size, p.color); }
  ctx.globalAlpha = 1;
  for (const p of G.pops) { ctx.globalAlpha = Math.min(1, p.life / 20); text(p.text, p.x - camx, p.y, 16, p.color, 'center'); }
  ctx.globalAlpha = 1;
  // дождь
  if (th.rain) {
    ctx.strokeStyle = 'rgba(170,200,230,.28)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < 70; i++) {
      const rx = ((hash(i * 3.7) * (VW + 200) - camx * 0.6 - G.frame * 3) % (VW + 200) + VW + 200) % (VW + 200) - 100;
      const ry = (hash(i * 9.1) * VH + G.frame * 14) % VH;
      ctx.moveTo(rx, ry); ctx.lineTo(rx - 5, ry + 16);
    }
    ctx.stroke();
  }
  // освещение (налобный фонарь)
  if (th.dark > 0 && G.P && G.state !== 'title') {
    const cx = G.P.x + G.P.w / 2 - camx + G.P.face * 30, cy = G.P.y + 6;
    const rg = ctx.createRadialGradient(cx, cy, 90, cx, cy, 520);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, `rgba(0,0,0,${th.dark})`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH);
  }
}

          R(x + cx0 + (bx >= 0 ? 1 : 0), y + by + 1, cx1 - cx0 - 1, 2, lit);
          if (bx >= 0) R(x + bx + 1, y + by + 1, 2, 14, 'rgba(255,255,255,.16)');
          R(x + cx0, y + by + 13, cx1 - cx0 - 1, 2, shd);
          if (bx + bw <= 32) R(x + bx + bw - 3, y + by + 1, 2, 14, 'rgba(0,0,0,.18)');
        }
        if (hash(tx * 31 + ty * 7) > 0.7) { R(x + 8, y + 22, 3, 2, 'rgba(0,0,0,.25)'); R(x + 9, y + 21, 2, 1, lit); }
        if (hash(tx * 17 + ty) > 0.75) R(x + 20, y + 6, 4, 2, 'rgba(0,0,0,.2)');
      } else if (th.style === 'earth') {
        R(x, y, T, T, th.wall);
        for (let i = 0; i < 3; i++) {

          R(sx, sy, sw, 4, i ? th.wall2 : '#8a7a62'); R(sx, sy, sw, 1, 'rgba(255,255,255,.25)'); R(sx, sy + 3, sw, 1, 'rgba(0,0,0,.3)');
        }

      } else {
        // кирпич 16×8 с фаской

            if (cx1 <= cx0) continue;

            R(x + cx0 + (bx >= 0 ? 1 : 0), y + r * 8 + 1, cx1 - cx0 - 1, 6, hash(tx * 5 + ty * 3 + r * 7 + k) > 0.5 ? th.wall : th.wall2);

      R(cx0, y + T - 6, cw, 3, 'rgba(0,0,0,.35)');
      // тёмное отверстие сверху
      R(L ? x + 4 : x, y + 2, L ? T - 4 : T - 4, 3, 'rgba(0,0,0,.55)');
      // болты

      R(x, y + 1, T, T - 2, '#000'); ctx.fillStyle = g; ctx.fillRect(x, y + 3, T, T - 6);

      }

    }
    case '-': {

      for (let i = 0; i < 4; i++) R(x + 3 + i * 8, y + 3, 4, 4, '#2c333a');
      R(x + 4, y + 8, 3, 8, '#454e57'); R(x + 25, y + 8, 3, 8, '#454e57');

    }
    case 'C': drawClog(x, y, tx, ty, bump); break;
    case 'Q': {

      for (let i = 0; i < 3; i++) { R(x + 4 + i * 10, y, 5, T, '#4b555e'); R(x + 4 + i * 10, y, 2, T, '#8a96a1'); }

  g.addColorStop(0.5, th.pipe); g.addColorStop(0.85, th.pipeLo); g.addColorStop(1, '#141a20');

function drawClog(x, y, tx, ty, bump) {
  const hp = G.lvl.clogHp.get(tx + ',' + ty);

  ctx.save(); ctx.translate(x + 16 + wob, y + 16);
  ctx.fillStyle = '#4a3220';

    ctx.stroke();

function drawEnemy(e, camx) {

    ctx.fillStyle = '#6f737a'; ctx.beginPath(); ctx.ellipse(22, 8, 6, 5, 0.2, 0, Math.PI * 2); ctx.fill();

    R(13, 7, 6, 2, '#5a4010'); R(20, 6, 5, 2, '#5a4010');

    ctx.fillStyle = '#5a2e12'; ctx.beginPath(); ctx.ellipse(10, 6, 10, 5.5, 0, 0, Math.PI * 2); ctx.fill();

    R(9, 2, 1, 8, '#2a1608');

  } else {
    const bob = e.onGround ? Math.sin(t * 0.2) : 0;

  '...KHHhHHhHHhHHK......',
  '..KHHHHhHHHHHhHHK.....',
  '..KHHhHHHHHhHHHHK.....',
  '..KHHHHHSSSSSSHHK.....',
  '..KHHHSSSSSSSSSSK.....',
  '..KHHSSKKKSSKKKSK.....',
  '..KHsSGGGGGGGGGGGGK...',
  '..KSsSGWWEGSGWWEGK....',
  '..KSsSGWWEGSGWWEGK....',
  '..KSSSGGGGGsGGGGGK....',
  '..KSSSSSSSSsSSSSK.....',
  '...KSSSMMMMMMMSSK.....',
  '...KSSSSSmmmSSSK......',
  '....KKSSSSSSSKK.......',
  '....KDDKSSSSKDDK......',
  '..KKDDRRRSSRRRDDKK....',
  '.KlDRRRRRrRRRRRRDDK...',
  '.KlDRRRRRDRRRRRrDDK...',
  '.KlDDDDDDdDDDDDDdDK...',
  '.KdDDRRRDdDRRRDDdDK...',
  '.KdDDDDDDdDDDDDDdDK...',
  '.KSSDDDDDdDDDDDDSSK...',
  '.KSsKKKKKKKKKKKKSsK...',
];
function makeSprite(rows, pal, override) {
  const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { const col = (override && override[ch]) || pal[ch]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }));
  return c;
}
const HERO_SPR = makeSprite(HERO_ROWS, HERO_PAL);
const HERO_SPR_DEAD = makeSprite(HERO_ROWS.map((r, i) => i === 9 || i === 10 ? r.replace(/WWE/g, i === 9 ? 'EWE' : 'WEW') : r), HERO_PAL);

function heroLeg(x0, off, lift) {
  const y0 = 21 - lift;
  R(x0 - 1, y0, 8, 7, '#1a1012'); R(x0, y0, 6, 6, '#3a3a48'); R(x0, y0, 2, 6, '#50505f');
  R(x0 + 2, y0 + 2, 3, 2, '#d81e2c');
  R(x0 - 1 + off, 26 - lift, 9, 4, '#1a1012'); R(x0 + off, 26 - lift, 7, 3, '#2a2a30'); R(x0 + 1 + off, 26 - lift, 3, 1, '#7a7a86');
}

function drawHero(P, camx) {
  if (P.inv > 0 && !P.dead && Math.floor(P.inv / 4) % 2 === 0) return;
  const x = Math.round(P.x - camx), y = Math.round(P.y);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(x + P.w / 2, y);
  if (P.dead) { ctx.translate(0, 15); ctx.rotate(Math.min(P.deathT, 25) / 25 * Math.PI); ctx.translate(0, -15); }
  ctx.scale(P.face, 1); ctx.translate(-P.w / 2, 0);
  const run = P.onGround && Math.abs(P.vx) > 0.5, air = !P.onGround && !P.dead;
  const ph = run ? Math.floor(P.anim / 1.6) % 4 : 0;
  const bob = run && ph % 2 ? -1 : 0;
  // бак гидромашины на спине
  if (G.power) { R(-6, 9 + bob, 9, 14, '#0e2a44'); R(-5, 10 + bob, 7, 12, '#1f6fb8'); R(-5, 10 + bob, 7, 3, '#8fd0ff'); R(-3, 22 + bob, 3, 3, '#14476f'); }
  // ноги (анимация)
  if (air) { heroLeg(4, -1, 2); heroLeg(11, 1, 0); }
  else if (run) { const a = [0, 2, 0, -2][ph]; heroLeg(4, a, ph === 1 ? 1 : 0); heroLeg(11, -a, ph === 3 ? 1 : 0); }
  else { heroLeg(4, -1, 0); heroLeg(11, 1, 0); }
  // туловище и голова
  ctx.drawImage(P.dead ? HERO_SPR_DEAD : HERO_SPR, 0, -4 + bob);
  ctx.translate(0, bob);
  if (G.lvl && G.lvl.theme.dark > 0 && !P.dead) { ctx.fillStyle = 'rgba(255,250,200,.10)'; ctx.beginPath(); ctx.moveTo(18, 4); ctx.lineTo(75, -14); ctx.lineTo(75, 26); ctx.closePath(); ctx.fill(); }
  // руки и вантуз
  if (P.attack > 0) {
    const e = P.attack > 9 ? (14 - P.attack) / 5 : P.attack > 4 ? 1 : P.attack / 4;
    const len = 6 + e * 16;
    R(12, 11, 9, 6, '#1a1012'); R(13, 12, 7, 4, '#3a3a48'); R(13, 12, 7, 1, '#6c6c80');
    R(20, 11, 4, 6, '#1a1012'); R(20, 12, 3, 4, '#f2b57e');
    R(23, 13, len, 3, '#4a2a12'); R(23, 13, len, 1, '#c08850');
    const cx = 23 + len;
    R(cx - 1, 7, 8, 14, '#1a1012'); R(cx, 8, 5, 12, '#d62828'); R(cx + 4, 9, 2, 10, '#9e1b1b'); R(cx, 8, 2, 12, '#ff6a6a');
  } else if (G.power && P.shootT > 0) {
    R(12, 11, 9, 6, '#1a1012'); R(13, 12, 7, 4, '#3a3a48'); R(20, 12, 3, 4, '#f2b57e');
    R(21, 10, 10, 7, '#1a1012'); R(22, 11, 8, 5, '#59636d'); R(22, 11, 8, 1, '#a9b4be'); R(29, 10, 3, 7, '#4fa3ff');
  } else {
    // вантуз стоит у руки, как трость
    R(18, 4, 3, 22, '#1a1012'); R(19, 5, 1, 20, '#c08850'); R(18, 5, 1, 20, '#7a4a22');
    R(14, 24, 10, 6, '#1a1012'); R(15, 25, 8, 4, '#d62828'); R(15, 25, 8, 1, '#ff6a6a'); R(21, 25, 2, 4, '#9e1b1b');
    R(16, 18, 5, 4, '#1a1012'); R(17, 18, 3, 3, '#f2b57e');
  }
  ctx.restore();
}

function drawHUD() {
  R(0, 0, VW, 40, 'rgba(0,0,0,.45)');
  for (let i = 0; i < 3; i++) drawHeart(22 + i * 26, 20, 9, i < (G.P ? G.P.hp : 0) ? '#ff4d6d' : 'rgba(255,255,255,.2)');
  text('×' + G.lives, 100, 20, 18, '#fff');
  // мини-вантузыч
  ctx.imageSmoothingEnabled = false; ctx.drawImage(HERO_SPR, 0, 0, 22, 18, 124, 8, 22, 18); ctx.imageSmoothingEnabled = true;
  drawNut(170, 20, 0); text('×' + String(G.nuts).padStart(2, '0'), 184, 20, 18, '#ffd84a');
  text('СЧЁТ ' + String(G.score).padStart(6, '0'), 250, 20, 18, '#fff');
  if (G.power) { drawGunItem(415, 8); text('ВОДА', 445, 20, 14, '#7fd4ff'); }
  const L = G.lvl;
  text(`${G.levelIdx + 1}. ${L.def.name}`, HUD_RIGHT - 92, 20, 16, '#f5c518', 'right');
  text('⏱ ' + G.time, HUD_RIGHT, 20, 18, G.time < 40 && G.frame % 30 < 15 ? '#ff4d4d' : '#fff', 'right');
  drawHudButtons();
  // полоска здоровья босса
  const B = L.boss;
  if (B && B.awake && !B.dead) {
    const w = 340, x = VW / 2 - w / 2, y = 52, k = B.hp / B.max;
    R(x - 2, y - 2, w + 4, 16, '#000'); R(x, y, w, 12, '#3a1a10');
    R(x, y, w * k, 12, k <= 0.5 ? (G.frame % 20 < 10 ? '#ff3a1a' : '#c0281a') : '#c0281a'); R(x, y, w * k, 3, 'rgba(255,255,255,.25)');
    text(B.name.toUpperCase(), VW / 2, y + 26, 15, '#ffb08a', 'center');
  }
}

function drawHudButtons() {
  const m = HUD_BTNS.mute, p = HUD_BTNS.pause, f = HUD_BTNS.fs;
  if (fsSupported) {
    R(f.x, f.y, f.w, f.h, 'rgba(255,255,255,.12)'); R(f.x, f.y, f.w, 1, 'rgba(255,255,255,.3)');
    const o = isFs() ? 1 : 0, x1 = f.x + 8, y1 = f.y + 7, x2 = f.x + 24, y2 = f.y + 23;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath();
    for (const [cx, cy, dx, dy] of [[x1, y1, 1, 1], [x2, y1, -1, 1], [x1, y2, 1, -1], [x2, y2, -1, -1]]) {
      const px = o ? cx + dx * 5 : cx, py = o ? cy + dy * 5 : cy;
      ctx.moveTo(px + (o ? -dx : dx) * 5, py); ctx.lineTo(px, py); ctx.lineTo(px, py + (o ? -dy : dy) * 5);
    }
    ctx.stroke();
  }
  for (const b of [m, p]) { R(b.x, b.y, b.w, b.h, 'rgba(255,255,255,.12)'); R(b.x, b.y, b.w, 1, 'rgba(255,255,255,.3)'); }
  // динамик
  R(m.x + 7, m.y + 11, 5, 8, '#fff');
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(m.x + 11, m.y + 11); ctx.lineTo(m.x + 17, m.y + 6); ctx.lineTo(m.x + 17, m.y + 24); ctx.lineTo(m.x + 11, m.y + 19); ctx.fill();
  ctx.strokeStyle = muted ? '#ff4d4d' : '#fff'; ctx.lineWidth = 2; ctx.beginPath();
  if (muted) { ctx.moveTo(m.x + 20, m.y + 10); ctx.lineTo(m.x + 27, m.y + 20); ctx.moveTo(m.x + 27, m.y + 10); ctx.lineTo(m.x + 20, m.y + 20); }
  else { ctx.arc(m.x + 17, m.y + 15, 5, -0.9, 0.9); ctx.moveTo(m.x + 25, m.y + 8); ctx.arc(m.x + 17, m.y + 15, 10, -0.8, 0.8); }
  ctx.stroke();
  // пауза
  R(p.x + 10, p.y + 8, 4, 14, '#fff'); R(p.x + 18, p.y + 8, 4, 14, '#fff');
}

function drawIntro() {
  const a = Math.min(1, G.stateT / 10) * (G.stateT > 95 ? Math.max(0, (110 - G.stateT) / 15) : 1);
  ctx.globalAlpha = a * 0.75; R(0, 0, VW, VH, '#05090e'); ctx.globalAlpha = a;
  text('УРОВЕНЬ ' + (G.levelIdx + 1) + ' ИЗ ' + LEVELS.length, VW / 2, VH / 2 - 50, 26, '#9fb0bf', 'center');
  text(G.lvl.def.name, VW / 2, VH / 2 - 8, 44, '#f5c518', 'center');
  text('Жизни: ' + G.lives + '   ·   Победи босса «' + BOSSES[G.lvl.def.boss].name + '» и уйди в слив!', VW / 2, VH / 2 + 44, 18, '#fff', 'center');
  ctx.globalAlpha = 1;
}

function drawClear() {
  ctx.globalAlpha = 0.6; R(0, VH / 2 - 80, VW, 160, '#05090e'); ctx.globalAlpha = 1;
  text('ТРУБА ПРОЧИЩЕНА!', VW / 2, VH / 2 - 30, 40, '#7fd4ff', 'center');
  text('Бонус за время: ' + (G.clearBonus * 10) + '   ·   Счёт: ' + G.score, VW / 2, VH / 2 + 24, 20, '#fff', 'center');
}

function drawTitle() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, 'rgba(5,9,14,.55)'); g.addColorStop(1, 'rgba(5,9,14,.85)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  // герой крупно
  ctx.save(); ctx.translate(VW / 2 - 70, 70); ctx.scale(4.5, 4.5);
  const fake = { x: 0, y: 0, w: 22, h: 30, vx: 0, face: 1, onGround: true, anim: 0, attack: G.frame % 90 < 14 ? 14 - (G.frame % 90) : 0, inv: 0, dead: false, shootT: 0 };
  const pw = G.power; G.power = false; const lvl = G.lvl; G.lvl = null;
  drawHero(fake, 0); G.power = pw; G.lvl = lvl;
  ctx.restore();
  text('ВАНТУЗЫЧ', VW / 2, 245, 72, '#ff7a1a', 'center');
  text('БИТВА С ЗАСОРАМИ', VW / 2, 300, 30, '#f5c518', 'center');
  const ctrl = isTouch ? 'Кнопки ◀ ▶ — бег · ПРЫЖОК · ВАНТУЗ — удар' : '← → бег · Пробел — прыжок · X — вантуз · ↓ — спрыгнуть · P — пауза';
  text(ctrl, VW / 2, 350, 17, '#dfe7ee', 'center');
  text('Пробивай засоры, собирай гайки, доберись до слива!', VW / 2, 378, 17, '#9fb0bf', 'center');
  if (G.frame % 60 < 40) text(isTouch ? 'Коснитесь экрана, чтобы начать' : 'Нажмите ENTER или ПРОБЕЛ', VW / 2, 430, 24, '#fff', 'center');
  if (LB.ok && LB.top.length) {
    const line = LB.top.slice(0, 3).map((r, i) => `${i + 1}. ${r.name} — ${Number(r.score).toLocaleString('ru')}`).join('     ');
    text('🏆 Лучшие мастера:  ' + line, VW / 2, 470, 16, '#7CFC9A', 'center');
  } else if (G.hi > 0) text('Ваш рекорд: ' + G.hi, VW / 2, 470, 16, '#7CFC9A', 'center');
  text(CONFIG.company + ' · ' + CONFIG.phone, VW / 2, VH - 22, 15, '#9fb0bf', 'center');
  drawHudButtons();
}

// ============================================================
//  Цикл
// ============================================================
G.lvl = buildLevel(0);
lbLoad();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(200, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// для отладки / автотестов
window.__vz = { G, LB, hitBoss, HERO_SPR, LEVELS, buildLevel, loadLevel, startGame, keys, pressed, kdown, kup };
})();
</script>
